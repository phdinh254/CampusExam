name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CampusExam_CI_123
          MSSQL_COLLATION: SQL_Latin1_General_CP1_CI_AS
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CampusExam_CI_123 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      # Integration test tạo database tạm CampusExam_Test_* trên máy chủ này rồi xóa.
      CAMPUSEXAM_TEST_SQLSERVER: Server=localhost,1433;User ID=sa;Password=CampusExam_CI_123;Encrypt=True;TrustServerCertificate=True

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CampusExam.sln

      - name: Kiểm tra định dạng
        run: dotnet format CampusExam.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build CampusExam.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test CampusExam.sln --configuration Release --no-build --logger "trx;LogFilePrefix=ket-qua"

      - name: Lưu kết quả test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/tests/**/TestResults/*.trx

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài đặt
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
